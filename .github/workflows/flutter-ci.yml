name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Resolver dependencias
        run: flutter pub get

      - name: Comprobar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test
